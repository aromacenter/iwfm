<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 142" role="img" aria-label="iwfm — Intelligence Workforce Management">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Emblem: lendületes gyűrű, benne csapat-pöttyök, felül antenna-pontok -->
  <g transform="translate(10,12)">
    <path d="M118 18 C160 38 162 92 118 116 C70 142 18 122 8 84 C2 60 18 34 48 22 C30 38 22 58 28 76 C38 106 84 118 112 100 C140 82 138 44 106 28 Z"
          fill="url(#blue)"/>
    <circle cx="58" cy="14" r="8" fill="url(#blue)"/>
    <rect x="55" y="20" width="6" height="26" rx="3" fill="url(#blue)"/>
    <circle cx="84" cy="4" r="8" fill="#22d3ee"/>
    <rect x="81" y="10" width="6" height="34" rx="3" fill="#0ea5e9"/>
    <!-- csapat -->
    <circle cx="62" cy="62" r="15" fill="#1d4ed8"/>
    <circle cx="90" cy="58" r="13" fill="#3b82f6"/>
    <circle cx="76" cy="84" r="17" fill="#2563eb"/>
    <circle cx="48" cy="86" r="12" fill="#60a5fa"/>
  </g>

  <!-- Szóvédjegy -->
  <text x="180" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="84"
        font-weight="800" font-style="italic" fill="url(#word)" letter-spacing="-2">iwfm</text>
</svg>
