# Iwfm — Alembic konfiguráció
# A tényleges DB-URL-t az env.py oldja fel (WFM_DATABASE_URL / DATABASE_URL);
# az itteni sqlalchemy.url csak lokális CLI-fallback.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./iwfm.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
